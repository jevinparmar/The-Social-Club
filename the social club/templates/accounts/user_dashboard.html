<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Side Dashboard</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
            background-color: #ffffff;
            color: #111827;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }
        .dashboard-title {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .logout-btn {
            padding: 0.5rem 1.25rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #ffffff;
            background-color: #0f172a;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
        }
        .logout-btn:hover {
            background-color: #1e293b;
        }
    </style>
</head>
<body>
    <div class="dashboard-title">User Side Dashboard</div>
    <a href="{% url 'accounts:logout' %}" class="logout-btn">Logout</a>
</body>
</html>
