{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MORROW{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/base/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/auth.css' %}">
</head>
<body class="auth-body">
    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-brand">
                <span class="brand-mark">MORROW</span>
                <p class="brand-tagline">Event Management &amp; Ticketing</p>
            </div>

            {% if messages %}
                <div class="auth-messages" role="alert">
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags|default:'info' }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            {% block content %}{% endblock %}
        </div>
    </main>
    <script src="{% static 'js/pages/auth.js' %}" defer></script>
</body>
</html>
